name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Tries to turn Pages on automatically. If this step fails with
      # "Resource not accessible by integration", Pages must be enabled once
      # by hand: Settings -> Pages -> Source: GitHub Actions.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Fetches the published URL with a plain, unauthenticated curl, so a
      # green run proves the page is publicly reachable without any login.
      - name: Verify the public URL works without login
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Checking $PAGE_URL anonymously (no credentials sent)"
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sSL -o page.html -w '%{http_code}' --max-time 20 "$PAGE_URL" || echo 000)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ] && grep -q 'Balchik i dag' page.html; then
              echo "OK: $PAGE_URL is public and serves the itinerary."
              # The photo is the one external asset the page needs; check it too.
              for asset in assets/familien.webp assets/familien.png; do
                acode=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 20 "$PAGE_URL$asset" || echo 000)
                echo "  $asset -> HTTP $acode"
                [ "$acode" = "200" ] || { echo "FAILED: $asset not served."; exit 1; }
              done
              exit 0
            fi
            sleep 15
          done
          echo "FAILED: $PAGE_URL did not serve the page anonymously."
          head -c 500 page.html || true
          exit 1
